<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorio de Eventos</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>

    <!-- TAREA 1: Párrafo que cambiará de estilo -->
    <p id="parrafo">Este es el párrafo que cambiará de estilo.</p>
    <button id="botonEstilo">Cambiar estilo</button>

    <hr>

    <!-- TAREA 2: Formulario con nombre y apellido -->
    <form id="form1">
        Nombre: <input type="text" name="fname" value="David"><br>
        Apellido: <input type="text" name="lname" value="Beckham"><br>
        <input type="submit" value="Enviar">
    </form>

    <hr>

    <!-- TAREA 3: Botón para alerta de enlaces -->
    <button id="botonEnlaces">Mostrar información de enlaces</button>
    <a href="https://ejemplo1.com">Enlace 1</a>
    <a href="https://ejemplo2.com">Enlace 2</a>
    <a href="https://ejemplo3.com">Enlace 3</a>

    <hr>

    <!-- TAREA EXTRA: Elementos para manipular -->
    <div id="contenedor">
        <p>Sección contenedor</p>
        <ul>
            <li class="segundo">Elemento 1</li>
            <li class="segundo">Elemento 2</li>
            <li class="tercero">Elemento 3</li>
        </ul>
        <ol>
            <li class="tercero">Elemento 4</li>
            <li class="tercero">Elemento 5</li>
        </ol>
    </div>
    <div class="footer">Pie de página</div>

    <!-- Tu script va aquí -->
    <script src="script.js"></script>

</body>

</html>
